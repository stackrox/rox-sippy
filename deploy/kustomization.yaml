apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: acs-sippy

namespace: acs-sippy

# Resources to deploy
resources:
- configmap.yaml
- secret-template.yaml
- postgres-statefulset.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- cronjob.yaml

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: acs-sippy
  app.kubernetes.io/component: ci-analytics

# Images to use (can be overridden via kustomize edit set image)
images:
- name: acs-sippy
  newName: acs-sippy
  newTag: latest
