apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acs-sippy
  labels:
    app: acs-sippy
  annotations:
    # Example annotations - adjust based on your ingress controller
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
  - host: acs-sippy.example.com  # CHANGEME: Replace with actual hostname
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: acs-sippy
            port:
              number: 80
  # Uncomment for TLS
  # tls:
  # - hosts:
  #   - acs-sippy.example.com
  #   secretName: acs-sippy-tls
