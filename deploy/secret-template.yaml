apiVersion: v1
kind: Secret
metadata:
  name: acs-sippy-secrets
  labels:
    app: acs-sippy
type: Opaque
stringData:
  # Database connection string
  # Replace with actual PostgreSQL DSN
  database-dsn: "postgresql://sippy:CHANGEME@postgres:5432/sippy?sslmode=disable"

  # BigQuery service account credentials JSON
  # Replace with actual GCP service account key JSON with read access to acs-san-stackroxci.ci_metrics
  bigquery-credentials.json: |
    {
      "type": "service_account",
      "project_id": "CHANGEME",
      "private_key_id": "CHANGEME",
      "private_key": "-----BEGIN PRIVATE KEY-----\nCHANGEME\n-----END PRIVATE KEY-----\n",
      "client_email": "CHANGEME@CHANGEME.iam.gserviceaccount.com",
      "client_id": "CHANGEME",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token",
      "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
      "client_x509_cert_url": "CHANGEME"
    }
